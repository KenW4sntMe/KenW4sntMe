<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80" viewBox="0 0 600 80">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Qwigley&amp;display=swap');
    .scroll-text {
      font-family: 'Qwigley', cursive, monospace;
      font-size: 30px;
      fill: #3FB1F7;
      font-weight: bold;
      animation: marquee 12s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
  <rect width="100%" height="100%" fill="transparent"/>
  <text x="0" y="50" class="scroll-text">The ocean doesn't belong to anyone, but we claim the horizon</text>
</svg>
