<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80" viewBox="0 0 600 80">
  <rect width="100%" height="100%" fill="#B4FF9600" rx="6"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Qwigley&amp;display=swap');
    .scroll-text {
      font-family: 'Qwigley', cursive;
      font-size: 32px;
      fill: #3FB1F7E4;
      animation: marquee 12s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
  <text x="0" y="48" class="scroll-text">The ocean doesn't belong to anyone, but we claim the horizon</text>
</svg>
<p align="center">
  <img src="./running-text.svg" alt="Running Text" />
</p>
